name: Link PR to its issue and move it to In Review

# spec-implementer often stacks a PR on an unmerged dependency's branch to
# keep per-task diffs small (CONVENTIONS.md -> "Branching, pushing, and PRs
# per task"). GitHub only registers a `Closes #N` keyword as a real linked
# issue (Development-sidebar link + auto-close-on-merge) while the PR's base
# is the repo's default branch, so a stacked PR's issue link never registers
# on its own.
#
# Two mechanisms that would have avoided touching the base at all are dead
# ends, both confirmed by direct testing against this repo (don't reintroduce
# either without re-testing):
#   * `gh issue develop <issue> --branch <existing-branch>` fails with
#     "API returned empty branch name" -- it can only CREATE a branch, and
#     spec-implementer always creates the branch before any PR exists.
#   * The underlying `createLinkedBranch` GraphQL mutation, called directly
#     with an existing branch name, returns `{"linkedBranch": null}` and
#     creates no link at all -- a silent no-op. Full mutation introspection
#     of GitHub's GraphQL schema confirms there is no other public mutation
#     that attaches a PR to an issue; the body keyword is the only mechanism.
#
# So this workflow does a ROUND TRIP: retarget the base to the default branch
# (which registers the link), then restore the PR's original base. The link is
# sticky -- it survives the base being moved back, and survives later pushes
# to the head branch. Verified end-to-end on a throwaway stacked PR: unlinked
# while based on the stacked branch, linked once based on `main`, and STILL
# linked after the stacked base was restored and a new commit pushed.
#
# If a future GitHub change breaks that stickiness, the post-restore check
# below catches it and leaves the PR on the default branch instead -- i.e. it
# degrades to the old always-retarget behaviour rather than losing the link.
#
# Moving the card to In Review requires a PAT with `project` scope (the
# default GITHUB_TOKEN can't write to a user-owned Projects v2 board) --
# see CONVENTIONS.md -> "GitHub issue / project sync" for the required
# `PROJECT_BOARD_TOKEN` secret.

on:
  pull_request:
    types: [opened, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  link-and-track:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract linked issue number from PR body
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issue=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$issue" ]; then
            echo "No Closes/Fixes/Resolves #N found in PR body -- not a tracked task PR, nothing to do."
          else
            echo "Found linked issue #$issue"
          fi
          echo "issue_number=$issue" >> "$GITHUB_OUTPUT"

      - name: Register the issue link without keeping the PR retargeted
        if: steps.extract.outputs.issue_number != '' && github.event.pull_request.base.ref != github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE: ${{ steps.extract.outputs.issue_number }}
          ORIGINAL_BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          echo "PR #$PR_NUMBER is stacked on '$ORIGINAL_BASE'; round-tripping via '$DEFAULT_BRANCH' to register the link to #$ISSUE."
          gh pr edit "$PR_NUMBER" --base "$DEFAULT_BRANCH"

          # The link registers asynchronously off the base change -- don't race it.
          sleep 5
          if ! bash .github/scripts/verify-issue-link.sh "$PR_NUMBER" "$ISSUE"; then
            echo "::warning::The link to #$ISSUE never registered even on '$DEFAULT_BRANCH'. Leaving the base there so it can still register late."
            exit 0
          fi

          echo "Link registered. Restoring the original base '$ORIGINAL_BASE'."
          gh pr edit "$PR_NUMBER" --base "$ORIGINAL_BASE"
          sleep 5

          if bash .github/scripts/verify-issue-link.sh "$PR_NUMBER" "$ISSUE"; then
            echo "Link to #$ISSUE survived the restore -- PR stays stacked on '$ORIGINAL_BASE'."
          else
            echo "::warning::The link to #$ISSUE did NOT survive restoring base '$ORIGINAL_BASE' -- GitHub's behaviour has changed. Retargeting to '$DEFAULT_BRANCH' to keep the link (the old always-retarget behaviour)."
            gh pr edit "$PR_NUMBER" --base "$DEFAULT_BRANCH"
            gh pr comment "$PR_NUMBER" --body "Automation note: this PR's base was moved from \`$ORIGINAL_BASE\` to \`$DEFAULT_BRANCH\` because the \`Closes #$ISSUE\` link doesn't hold on a stacked base. Its diff therefore includes the dependency's not-yet-merged commits until that dependency lands."
          fi

      - name: Move issue to In Review on the Project board
        if: steps.extract.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue_number }}
        run: bash .github/scripts/move-project-card.sh "$ISSUE" "In Review"

  # A stacked PR merged into its dependency's branch rather than into the
  # default branch never triggers GitHub's own auto-close, even with a
  # correctly registered link (verified on the same throwaway PR: merged into
  # its stacked base, issue stayed open). Since the round trip above keeps
  # stacked PRs stacked, closing the issue has to be explicit.
  close-on-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract linked issue number from PR body
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issue=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$issue" ]; then
            echo "No Closes/Fixes/Resolves #N found in PR body -- not a tracked task PR, nothing to do."
          else
            echo "Found linked issue #$issue"
          fi
          echo "issue_number=$issue" >> "$GITHUB_OUTPUT"

      - name: Close the linked issue
        if: steps.extract.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.extract.outputs.issue_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state=$(gh issue view "$ISSUE" --repo "$REPO" --json state --jq .state)
          if [ "$state" = "CLOSED" ]; then
            echo "Issue #$ISSUE is already closed -- nothing to do."
          else
            gh issue close "$ISSUE" --repo "$REPO" --reason completed \
              --comment "Closed automatically: PR #$PR_NUMBER merged."
          fi

      - name: Move issue to Done on the Project board
        if: steps.extract.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
          ISSUE: ${{ steps.extract.outputs.issue_number }}
        run: bash .github/scripts/move-project-card.sh "$ISSUE" "Done"
