name: Auto-implement unimplemented issues

on:
  schedule:
    - cron: "3 * * * *" # hourly, at :03 past the hour (avoids the :00 thundering-herd slot)
  issues:
    types: [opened]
  workflow_dispatch: {}

jobs:
  check-for-work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      has_candidate: ${{ steps.check.outputs.has_candidate }}
      task_file: ${{ steps.check.outputs.task_file }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for an eligible unimplemented issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/check-unimplemented-issues.sh

  implement:
    needs: check-for-work
    if: needs.check-for-work.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    concurrency:
      group: auto-implement-issues
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code to implement the selected task
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 300 --dangerously-skip-permissions"
          prompt: |
            You are running as an automated GitHub Actions job for this repository
            (already checked out, full git history available). A separate cheap
            pre-check job has already resolved which task to implement — you do not
            need to list issues, search specs/**/tasks, or dedupe against existing
            branches/PRs yourself; that's already been done deterministically.

            Task file to implement: ${{ needs.check-for-work.outputs.task_file }}
            Linked GitHub issue: #${{ needs.check-for-work.outputs.issue_number }}

            This repo has a custom /implement <task-file> command
            (.claude/commands/implement.md) and a spec-implementer agent
            (.claude/agents/spec-implementer.md) that together implement exactly one
            task via strict red-green TDD, then push a branch and open a PR — never
            merging. Read both of those files in full now, then carry out that exact
            procedure yourself for the task file above — spawn spec-implementer as a
            subagent via your Task/Agent tool if it's available in this environment;
            if it isn't, perform its documented steps directly, in this same session,
            exactly as written. Do not assume "/implement" will be parsed as a working
            slash command here — treat the command/agent files as the literal
            instructions to follow, not as a command to invoke by name. Let the
            outcome be whatever it is, including declining because of an unmet
            dependency or a draft story — the pre-check job only verified
            Status: Not Started and the absence of an existing branch/PR, not
            dependency readiness.

            IMPORTANT — PR fallback: `spec-implementer`'s own instructions
            (.claude/agents/spec-implementer.md) try to open the PR via the `github`
            MCP server, and explicitly fall back to "push the branch but skip the PR"
            if that MCP server isn't reachable — which it will not be in this
            environment (no MCP server is configured for this workflow). So: once the
            task is `Done` and the branch is pushed, if no PR was opened, open the PR
            yourself right now using `gh pr create` (gh CLI IS available in this
            GitHub Actions runner) — base it against `main` (or the dependency branch
            it reports stacking on), title `[<task-id>] <short title>`, body
            containing the task's **Test:** and **Done when:** fields verbatim, a
            link to the task file, and `Closes #<issue>` if the task has a linked
            GitHub Issue number. Never merge it.

            Final report: which issue/task this was, and the outcome (PR URL, or the
            specific reason it was blocked/failed).

            Hard rules: implement only this one task. Never merge any pull request.
