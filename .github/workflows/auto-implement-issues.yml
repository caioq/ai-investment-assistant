name: Auto-implement unimplemented issues

on:
  schedule:
    - cron: "3 23 * * *" # ~9:03am Australia/Sydney daily
  issues:
    types: [opened]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: auto-implement-issues
  cancel-in-progress: false

jobs:
  auto-implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code to implement the next unimplemented issue
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 150"
          prompt: |
            You are running as an automated GitHub Actions job for this repository
            (already checked out in the working directory, full git history available).
            Your job: find unimplemented work tracked as GitHub issues and start
            implementing it, following this repo's existing spec-driven workflow
            (see CLAUDE.md, WORKFLOW.md, CONVENTIONS.md). You have no memory of
            previous runs — everything you need is below.

            Background:
            - Every task file under specs/<module>/tasks/*.md has a **Status:** field
              (Not Started | In Progress | Done) and, if mirrored to GitHub, a
              **GitHub Issue:** #<N> (owner/repo — created by /user-stories) field.
            - This repo has a /implement <task-file-or-id> command and a
              spec-implementer agent (.claude/commands/implement.md,
              .claude/agents/spec-implementer.md) that implement exactly one task via
              strict red-green TDD, then push a branch and open a PR — never merging.
            - Per CONVENTIONS.md, spec-implementer always names its branch
              task/<task-file-basename-without-.md> — this is deterministic.

            Do the following, in order:

            0. PREFLIGHT (mandatory, before anything else): confirm `gh auth status`
               succeeds and `gh issue list --state open --limit 100` succeeds. If
               either fails, stop immediately and end the run reporting "Preflight
               failed" with the actual error output. Do not proceed to any step below.

            1. List all open issues:
               `gh issue list --state open --limit 100 --json number,title,url`.

            2. For each open issue number, search specs/**/tasks/*.md for a line
               matching `**GitHub Issue:** #<that number>`. Split into two buckets:
               (a) issues with a matching task file, (b) open issues with no matching
               task file at all ("unmanaged" — not created by /user-stories).

            3. From bucket (a), keep only task files whose **Status:** is exactly
               "Not Started".

            4. For each remaining candidate, check whether work is already in flight
               before treating it as eligible:
               - Run `gh pr list --state open --head "task/<basename>" --json number,url`
                 (where <basename> is that task file's own filename minus `.md`). If
                 this returns any PR, exclude the candidate — it already has an open,
                 unmerged PR; do not re-implement it or open a duplicate PR.
               - Also check whether the branch `task/<basename>` already exists on the
                 remote (e.g. `gh api repos/{owner}/{repo}/branches/task/<basename>`
                 succeeds). If it does, exclude the candidate too, even if no PR is open
                 yet — work may already be underway or mid-flight.

            5. If no candidates remain after step 4: end the run. Report "No
               unimplemented, not-yet-started issues found" plus the unmanaged list
               from step 2(b) (informational only — never comment on, label, or close
               those issues).

            6. Otherwise, pick the remaining eligible task whose linked GitHub issue
               number is the LOWEST (the oldest open issue). Run this repo's
               /implement <path-to-that-task-file> workflow on it exactly as defined in
               .claude/commands/implement.md (it will launch the spec-implementer agent
               in an isolated git worktree and run red-green TDD). Let it report
               whatever outcome it reports, including if it declines due to an unmet
               dependency or a draft story.

               IMPORTANT — PR fallback: `spec-implementer`'s own instructions
               (.claude/agents/spec-implementer.md) now try to open the PR via the
               `github` MCP server, and explicitly fall back to "push the branch but
               skip the PR" if that MCP server isn't reachable — which it will not be
               in this environment (no MCP server is configured for this workflow).
               So: after /implement finishes, if its report says the task is `Done`
               and the branch was pushed but no PR was opened, open the PR yourself
               right now using `gh pr create` (gh CLI IS available in this GitHub
               Actions runner, unlike the local worktree sandbox spec-implementer was
               written for) — base it against `main` (or the dependency branch it
               reports stacking on), title `[<task-id>] <short title>`, body containing
               the task's **Test:** and **Done when:** fields verbatim, a link to the
               task file, and `Closes #<issue>` if the task has a linked GitHub Issue
               number. Never merge it.

            7. Final report: (a) which issue/task was picked and the outcome (PR URL —
               whether opened by spec-implementer or by your step-6 fallback — or the
               specific reason it was blocked/failed), (b) any candidates excluded in
               step 4 because a PR or branch already existed for them, and (c) the
               unmanaged open-issue list from step 2(b) for human awareness.

            Hard rules: attempt at most ONE task per run. Never modify, comment on,
            label, or close any GitHub issue that has no matching task file. Never
            merge any pull request. Never re-implement a task that already has an open
            PR or an existing branch for it.
